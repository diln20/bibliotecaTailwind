s.","pitfall":"Poner muchas columnas fijas en móvil. Combínalo con breakpoints.","example":"<div class=\"grid grid-cols-1 md:grid-cols-3\">...</div>","preview":"<div class=\"grid grid-cols-3 gap-2\"><div class=\"bg-slate-100 p-2\">1</div><div class=\"bg-slate-100 p-2\">2</div><div class=\"bg-slate-100 p-2\">3</div></div>"},{"name":"grid-template-rows","family":"grid-rows-*","css":"grid-template-rows: repeat(2,minmax(0,1fr));","what":"Define las filas explícitas del grid.","values":"grid-rows-1 … grid-rows-12, grid-rows-none, grid-rows-subgrid, valores arbitrarios.","when":"Dashboards, áreas con filas equilibradas y composiciones controladas.","pitfall":"Crear filas rígidas para contenido cuyo alto cambia mucho.","example":"<div class=\"grid grid-rows-2\">...</div>","preview":"<div class=\"grid h-24 grid-rows-2 gap-2\"><div class=\"bg-cyan-100 p-2\">Fila 1</div><div class=\"bg-slate-100 p-2\">Fila 2</div></div>"},{"name":"gap","family":"gap-*","css":"gap: 1rem;","what":"Separa las celdas del grid de forma consistente.","values":"gap-4, gap-x-6, gap-y-2.","when":"Separación entre tarjetas y celdas.","pitfall":"Añadir margin a cada tarjeta y complicar los bordes externos de la grilla.","example":"<div class=\"grid gap-6\">...</div>","preview":"<div class=\"grid grid-cols-3 gap-4\"><div class=\"bg-slate-100 p-2\">A</div><div class=\"bg-slate-100 p-2\">B</div><div class=\"bg-slate-100 p-2\">C</div></div>"},{"name":"grid-column","family":"col-span-* / col-start-* / col-end-*","css":"grid-column: span 2 / span 2;","what":"Permite que un ítem ocupe varias columnas o empiece/termine en líneas concretas.","values":"col-span-2, col-span-full, col-start-2, col-end-4.","when":"Tarjetas destacadas, layouts tipo magazine y dashboards.","pitfall":"Usar spans mayores al número de columnas definido y obtener resultados difíciles de entender.","example":"<div class=\"col-span-2\">...</div>","preview":"<div class=\"grid grid-cols-3 gap-2\"><div class=\"col-span-2 bg-cyan-100 p-2\">col-span-2</div><div class=\"bg-slate-100 p-2\">1</div></div>"},{"name":"grid-row","family":"row-span-* / row-start-* / row-end-*","css":"grid-row: span 2 / span 2;","what":"Hace que un ítem abarque varias filas o líneas del grid.","values":"row-span-2, row-span-full, row-start-1, row-end-3.","when":"Mosaicos y dashboards con tarjetas altas.","pitfall":"Combinar muchos spans manuales antes de definir una estructura clara.","example":"<div class=\"row-span-2\">...</div>","preview":"<div class=\"grid h-28 grid-cols-2 grid-rows-2 gap-2\"><div class=\"row-span-2 bg-cyan-100 p-2\">row-span-2</div><div class=\"bg-slate-100 p-2\">A</div><div class=\"bg-slate-100 p-2\">B</div></div>"},{"name":"place-items","family":"place-items-*","css":"place-items: center;","what":"Atajo para alinear los ítems en ambos ejes dentro de sus áreas de grid.","values":"place-items-start, place-items-center, place-items-end, place-items-stretch.","when":"Centrar contenido en celdas o tarjetas.","pitfall":"Confundir place-items con place-content: uno alinea ítems; el otro distribuye la grilla completa dentro del contenedor.","example":"<div class=\"grid place-items-center\">...</div>","preview":"<div class=\"grid h-20 place-items-center rounded bg-slate-100\"><span class=\"rounded bg-cyan-200 p-2\">centrado</span></div>"}]},{"id":"states","group":"Utilidades","title":"Hover, focus y otros estados","subtitle":"Haz que botones y enlaces respondan a la interacción.","easy":"Los prefijos hover:, focus: y focus-visible: aplican utilidades solo en determinados estados.","daily":"Un botón físico cambia o hace clic; una interfaz digital necesita señales visuales equivalentes.","behind":"Tailwind genera selectores CSS para cada variante. focus-visible es especialmente útil para navegación con teclado.","remember":"No elimines el foco sin ofrecer una alternativa visible.","why":"Los botones del proyecto deben comunicar cuándo se pueden pulsar y dónde está el foco del teclado.","files":[["index.html","Mejora botones y enlaces con estados","edit"]],"steps":["Ubica el botón principal del hero.","Agrega hover:bg-cyan-400.","Agrega transition.","Agrega focus-visible:outline-none y focus-visible:ring-4.","Navega con Tab para probar el foco."],"code_file":"tailwind_academy/index.html","code":"<a href=\"#cursos\" class=\"inline-flex rounded-xl bg-cyan-500 px-5 py-3 font-bold text-slate-950 transition hover:bg-cyan-400 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-300\">\n  Ver cursos\n</a>","check":"Con mouse el botón cambia al pasar encima; con Tab aparece un indicador de foco visible.","activity":"Agrega un segundo botón “Ver proyecto” con estilo secundario y estados coherentes.","extra":"Hover no sustituye focus: usuarios de teclado también necesitan retroalimentación.","preview":"<button class=\"rounded-xl bg-cyan-500 px-5 py-3 font-bold text-slate-950 transition hover:bg-cyan-400 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-300\">Pasa el mouse o usa Tab</button>","properties":[{"name":":hover","family":"hover:*","css":"selector:hover { ... }","what":"Aplica una utilidad solo mientras el puntero está sobre el elemento.","values":"hover:bg-*, hover:text-*, hover:scale-*, hover:shadow-* y casi cualquier utilidad.","when":"Botones, enlaces y tarjetas interactivas.","pitfall":"Depender únicamente de hover: en pantallas táctiles no existe de la misma manera.","example":"<button class=\"bg-cyan-500 hover:bg-cyan-400\">...</button>","preview":"<button class=\"rounded-lg bg-cyan-500 px-4 py-2 font-bold transition hover:bg-cyan-400\">Pasa el mouse</button>"},{"name":":focus-visible","family":"focus-visible:*","css":":focus-visible { ... }","what":"Muestra estilos cuando el control recibe foco de una forma que requiere indicador visible, normalmente navegación por teclado.","values":"focus-visible:ring-*, focus-visible:outline-none, focus-visible:border-*","when":"Accesibilidad de botones, enlaces, inputs y controles.","pitfall":"Quitar outline sin reemplazarlo por un indicador visible.","example":"<button class=\"focus-visible:ring-4\">...</button>","preview":"<button class=\"rounded-lg border px-4 py-2 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-300\">Usa Tab</button>"},{"name":":active","family":"active:*","css":":active { ... }","what":"Aplica estilo mientras el elemento está siendo activado/presionado.","values":"active:scale-95, active:bg-*, active:shadow-none.","when":"Dar respuesta inmediata al click/tap.","pitfall":"Exagerar la transformación y hacer que el layout “salte”.","example":"<button class=\"active:scale-95\">...</button>","preview":"<button class=\"rounded-lg bg-slate-900 px-4 py-2 text-white transition active:scale-95\">Presiona</button>"},{"name":":disabled","family":"disabled:*","css":":disabled { ... }","what":"Estiliza controles HTML realmente deshabilitados mediante el atributo disabled.","values":"disabled:opacity-50, disabled:cursor-not-allowed, disabled:bg-*","when":"Formularios y acciones no disponibles temporalmente.","pitfall":"Simular deshabilitado solo con color sin usar disabled; el botón seguiría siendo interactivo.","example":"<button disabled class=\"disabled:opacity-50\">...</button>","preview":"<button disabled class=\"rounded-lg bg-cyan-500 px-4 py-2 font-bold disabled:cursor-not-allowed disabled:opacity-50\">No disponible</button>"},{"name":"group","family":"group + group-hover:*","css":"estado de un ancestro -> estilos en un descendiente","what":"Permite que el estado del padre cambie estilos en un hijo.","values":"group en el padre; group-hover:*, group-focus:* y variantes nombradas.","when":"Tarjetas donde al pasar sobre toda la tarjeta cambia icono/título interno.","pitfall":"Olvidar colocar group en el ancestro.","example":"<article class=\"group\"><h3 class=\"group-hover:text-cyan-600\">...</h3></article>","preview":"<div class=\"group rounded-xl border p-4 hover:bg-slate-50\"><b class=\"group-hover:text-cyan-700\">Hover sobre toda la tarjeta</b></div>"},{"name":"peer","family":"peer + peer-*","css":"estado de un hermano -> estilos en otro hermano","what":"Permite reaccionar al estado de un elemento hermano marcado como peer.","values":"peer, peer-checked:*, peer-invalid:*, peer-focus:*","when":"Checkboxes personalizados, validación y labels reactivos.","pitfall":"El elemento que reacciona debe venir después del peer por cómo funciona el selector CSS usado.","example":"<input class=\"peer\" type=\"checkbox\"><span class=\"peer-checked:text-emerald-600\">...</span>","preview":"<label class=\"flex gap-2\"><input type=\"checkbox\" class=\"peer\"><span class=\"peer-checked:font-bold peer-checked:text-emerald-600\">Aceptado</span></label>"}]},{"id":"responsive","group":"Responsive","title":"Diseño responsive","subtitle":"Adapta la misma interfaz a móvil, tablet y escritorio.","easy":"Tailwind es mobile-first: una clase sin prefijo aplica desde pantallas pequeñas; md: y lg: agregan cambios desde esos breakpoints.","daily":"Es como una mochila que se reorganiza según el espacio disponible: el contenido es el mismo, cambia su distribución.","behind":"md:grid-cols-2 se aplica desde md; lg:grid-cols-3 desde lg. No significa “solo tablet” o “solo escritorio”, sino “desde este ancho en adelante”.","remember":"Diseña primero la versión pequeña y añade mejoras para más espacio.","why":"La cuadrícula de cursos todavía usa una columna fija.","files":[["index.html","Haz responsive la cuadrícula y el hero","edit"]],"steps":["Mantén grid-cols-1 como base.","Agrega md:grid-cols-2.","Agrega lg:grid-cols-3.","Ajusta el h1 con text-4xl md:text-5xl lg:text-6xl.","Prueba redimensionando el navegador."],"code_file":"tailwind_academy/index.html","code":"<div class=\"grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3\">\n  ...tarjetas...\n</div>\n\n<h1 class=\"text-4xl font-black md:text-5xl lg:text-6xl\">\n  Aprende Tailwind construyendo\n</h1>","check":"En móvil ves una columna; al crecer la pantalla aparecen dos y después tres.","activity":"Haz que una sección cambie de flex-col a md:flex-row.","extra":"Los prefijos responsive se pueden combinar con estados, por ejemplo md:hover:... cuando tiene sentido.","preview":"<div class=\"grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3\"><div class=\"rounded-xl bg-slate-100 p-4\">Móvil 1 col</div><div class=\"rounded-xl bg-slate-100 p-4\">Tablet 2</div><div class=\"rounded-xl bg-slate-100 p-4\">Desktop 3</div></div>","properties":[{"name":"breakpoint mínimo","family":"sm:, md:, lg:, xl:, 2xl:","css":"@media (width >= ... )","what":"Aplica una utilidad desde un ancho mínimo hacia arriba. Tailwind trabaja mobile-first.","values":"sm 40rem/640px, md 48rem/768px, lg 64rem/1024px, xl 80rem/1280px, 2xl 96rem/1536px.","when":"Cambiar columnas, espacios, tipografía o dirección de layout según ancho.","pitfall":"Interpretar md: como “solo tablet”. Significa md y cualquier pantalla mayor salvo que otra variante lo sobrescriba.","example":"<div class=\"grid grid-cols-1 md:grid-cols-3\">...</div>","preview":"<div class=\"rounded bg-slate-100 p-3 text-sm md:text-lg\">Cambia desde md:</div>"},{"name":"rango máximo","family":"max-sm:, max-md: …","css":"@media (width < ... )","what":"Aplica utilidades por debajo de un breakpoint concreto.","values":"max-sm:*, max-md:*, etc.; se puede combinar con md:max-lg:* para rangos.","when":"Ajustes puntuales cuando una regla debe existir solo por debajo de cierto tamaño.","pitfall":"Abusar de rangos cuando un enfoque mobile-first simple sería más legible.","example":"<div class=\"max-md:hidden\">...</div>","preview":"<div class=\"rounded bg-cyan-100 p-3 max-md:text-sm\">max-md:text-sm</div>"},{"name":"container queries","family":"@container + @sm:*","css":"@container ...","what":"Hace que un componente responda al tamaño de su CONTENEDOR en vez de toda la ventana.","values":"@container en el padre; @sm:*, @md:* en descendientes.","when":"Componentes reutilizables que pueden vivir en sidebars o zonas de distinto ancho.","pitfall":"Confundir @md: con md:. @md observa contenedor; md: observa viewport.","example":"<div class=\"@container\"><div class=\"flex flex-col @md:flex-row\">...</div></div>","preview":"<div class=\"@container rounded border p-3\"><div class=\"flex flex-col gap-2 @md:flex-row\"><span class=\"bg-slate-100 p-2\">A</span><span class=\"bg-cyan-100 p-2\">B</span></div></div>"}]},{"id":"dark-mode","group":"Responsive","title":"Modo oscuro","subtitle":"Aplica variantes dark: y entiende modo automático vs manual.","easy":"La variante dark: permite definir estilos alternativos. Por defecto sigue prefers-color-scheme, pero puedes cambiarla para controlarla con una clase.","daily":"Es como tener dos paletas del mismo diseño: la estructura se mantiene y cambian superficies y contraste.","behind":"dark:bg-slate-900 solo aplica cuando está activo el modo oscuro. Para un interruptor manual se puede redefinir la variante dark con @custom-variant.","remember":"Modo oscuro no significa invertir colores; hay que conservar contraste y jerarquía.","why":"Las tarjetas y el fondo del proyecto ya están listos para recibir una segunda paleta.","files":[["src/input.css","Opcional: controla dark con clase .dark","edit"],["index.html","Agrega utilidades dark:*","edit"]],"steps":["Primero prueba dark:* con el tema del sistema.","En una tarjeta agrega dark:bg-slate-900 y dark:text-white.","Si quieres control manual, redefine dark en input.css.","Agrega o quita class=\"dark\" en html para comprobar."],"code_file":"src/input.css + ejemplo HTML","code":"@import \"tailwindcss\";\n@custom-variant dark (&:where(.dark, .dark *));\n\n/* HTML */\n<article class=\"bg-white text-slate-900 dark:bg-slate-900 dark:text-white\">\n  Curso Tailwind\n</article>","check":"Al agregar class=\"dark\" a html, la tarjeta debe cambiar a superficie oscura y texto claro.","activity":"Agrega dark: a la navegación y al fondo general sin perder contraste en enlaces.","extra":"Si no necesitas botón manual, puedes mantener el comportamiento por preferencia del sistema.","preview":"<div class=\"grid gap-3 sm:grid-cols-2\"><div class=\"rounded-xl border bg-white p-4 text-slate-900\">Claro</div><div class=\"rounded-xl bg-slate-900 p-4 text-white\">Oscuro</div></div>","properties":[{"name":"dark variant","family":"dark:*","css":"@media (prefers-color-scheme: dark) o selector configurado","what":"Aplica una utilidad alternativa cuando el modo oscuro está activo.","values":"dark:bg-slate-900, dark:text-white, dark:border-slate-700, etc.","when":"Crear pares claros/oscuros para superficies, texto, bordes y estados.","pitfall":"Solo cambiar el fondo y olvidar contraste del texto, bordes y estados de foco.","example":"<div class=\"bg-white text-slate-900 dark:bg-slate-900 dark:text-white\">...</div>","preview":"<div class=\"rounded-xl bg-white p-4 text-slate-900 shadow dark:bg-slate-900 dark:text-white\">Claro / oscuro</div>"},{"name":"selector manual","family":"@custom-variant dark (...)","css":"@custom-variant dark (&:where(.dark, .dark *));","what":"Permite activar dark mediante una clase o atributo que tú controlas en lugar de depender solo del sistema.","values":"Clase .dark en html, o variantes basadas en [data-theme=dark].","when":"Interruptor de tema y persistencia en localStorage.","pitfall":"Cambiar la clase en un div interno y esperar que todo el documento reaccione si tus estilos dependen de html.dark.","example":"<html class=\"dark\">...</html>","preview":"<div class=\"rounded bg-slate-900 p-3 text-white\">Con selector manual puedes controlar el tema desde JavaScript.</div>"}]},{"id":"transitions","group":"Responsive","title":"Transiciones y transformaciones, propiedad por propiedad","subtitle":"Añade movimiento breve y útil.","easy":"transition, duration-* y transformaciones como scale-* o translate-* permiten microinteracciones sin escribir keyframes para todo.","daily":"Un pequeño movimiento al pasar el mouse puede confirmar que una tarjeta es interactiva.","behind":"Las utilidades de transición definen qué propiedades animar y cuánto tarda el cambio.","remember":"Movimiento corto y con propósito; evita distraer.","why":"Las tarjetas ya tienen estados y ahora pueden comunicar mejor que son clicables.","files":[["index.html","Agrega microinteracciones a tarjetas","edit"]],"steps":["Selecciona una tarjeta enlazable.","Agrega transition y duration-200.","Agrega hover:-translate-y-1.","Agrega hover:shadow-lg.","Comprueba que el contenido no salte de forma brusca."],"code_file":"tailwind_academy/index.html","code":"<article class=\"rounded-2xl border bg-white p-6 shadow-sm transition duration-200 hover:-translate-y-1 hover:shadow-lg\">\n  ...\n</article>","check":"La tarjeta sube levemente y la sombra aumenta al pasar el mouse.","activity":"Prueba duration-75, duration-200 y duration-500 y decide cuál se siente más natural.","extra":"No animes por animar; prioriza comprensión y accesibilidad.","preview":"<div class=\"rounded-2xl border bg-white p-5 shadow-sm transition duration-200 hover:-translate-y-1 hover:shadow-lg\">Pasa el mouse sobre esta tarjeta.</div>","properties":[{"name":"transition-property","family":"transition / transition-colors / transition-transform","css":"transition-property: ...;","what":"Define QUÉ propiedades se animan cuando cambian.","values":"transition, transition-all, transition-colors, transition-opacity, transition-shadow, transition-transform, transition-none.","when":"Hover suave, apertura/cierre y microinteracciones.","pitfall":"Usar transition-all indiscriminadamente; puede animar cambios que no querías.","example":"<button class=\"transition-colors hover:bg-cyan-400\">...</button>","preview":"<button class=\"rounded bg-cyan-500 px-4 py-2 transition-colors hover:bg-cyan-400\">transition-colors</button>"},{"name":"transition-duration","family":"duration-*","css":"transition-duration: 300ms;","what":"Define cuánto tarda la transición.","values":"duration-75, 100, 150, 200, 300, 500, 700, 1000 y valores arbitrarios.","when":"Ajustar sensación de rapidez o suavidad.","pitfall":"Duraciones muy largas en botones; la interfaz se siente lenta.","example":"<div class=\"duration-300\">...</div>","preview":"<div class=\"rounded bg-slate-100 p-3 transition duration-300 hover:bg-cyan-100\">duration-300</div>"},{"name":"timing-function","family":"ease-*","css":"transition-timing-function: cubic-bezier(...);","what":"Controla la aceleración de la animación, no su duración.","values":"ease-linear, ease-in, ease-out, ease-in-out y funciones personalizadas.","when":"Entradas/salidas y sensación natural del movimiento.","pitfall":"Pensar que ease-out hace la transición más corta. Solo cambia la curva de velocidad.","example":"<div class=\"ease-out\">...</div>","preview":"<div class=\"rounded bg-slate-100 p-3 transition duration-500 ease-out hover:translate-x-3\">ease-out</div>"},{"name":"delay","family":"delay-*","css":"transition-delay: 150ms;","what":"Retrasa el inicio de la transición.","values":"delay-75, 100, 150, 200, 300, 500, 700, 1000.","when":"Staggers simples o interacciones donde una respuesta diferida tenga sentido.","pitfall":"Añadir delay a acciones críticas y hacer que la interfaz parezca que no respondió.","example":"<div class=\"delay-150\">...</div>","preview":"<div class=\"rounded bg-slate-100 p-3 transition delay-150 hover:bg-cyan-100\">delay-150</div>"},{"name":"translate","family":"translate-x-* / translate-y-*","css":"transform: translate(...);","what":"Mueve visualmente el elemento sin cambiar el flujo normal del documento.","values":"translate-x-1, -translate-y-1, translate-full, translate-[10px].","when":"Microinteracciones, paneles, iconos y posicionamiento visual.","pitfall":"Usarlo para crear layout estructural; para eso usa flex/grid/margin/position.","example":"<button class=\"hover:-translate-y-1\">...</button>","preview":"<button class=\"rounded bg-slate-900 px-4 py-2 text-white transition-transform hover:-translate-y-1\">Sube 1 paso</button>"},{"name":"scale","family":"scale-*","css":"transform: scale(.95);","what":"Aumenta o reduce visualmente un elemento alrededor de su origen de transformación.","values":"scale-90, scale-95, scale-100, scale-105, scale-110 y valores arbitrarios.","when":"Feedback al presionar o destacar elementos.","pitfall":"Escalar mucho texto puede producir desenfoque o superposición.","example":"<button class=\"active:scale-95\">...</button>","preview":"<button class=\"rounded bg-cyan-500 px-4 py-2 font-bold transition-transform active:scale-95\">Click</button>"},{"name":"rotate","family":"rotate-*","css":"transform: rotate(45deg);","what":"Rota el elemento.","values":"rotate-1, rotate-3, rotate-6, rotate-45, rotate-90, -rotate-6, etc.","when":"Flechas, iconos, indicadores y detalles decorativos.","pitfall":"Rotar elementos interactivos sin mantener un área de click cómoda.","example":"<span class=\"rotate-45\">+</span>","preview":"<div class=\"inline-block rotate-6 rounded bg-cyan-100 p-3 font-bold\">rotate-6</div>"},{"name":"transform-origin","family":"origin-*","css":"transform-origin: center;","what":"Define el punto desde el que se aplican rotaciones y escalados.","values":"origin-center, origin-top, origin-top-right, origin-left, etc.","when":"Menús desplegables, escalados y rotaciones más naturales.","pitfall":"Cambiar scale/rotate y no entender por qué el elemento se mueve desde un punto inesperado.","example":"<div class=\"origin-top-left hover:rotate-6\">...</div>","preview":"<div class=\"inline-block origin-left rounded bg-slate-100 p-3 transition hover:scale-110\">origin-left</div>"}]},{"id":"formularios","group":"Responsive","title":"Formularios","subtitle":"Construye un bloque de inscripción claro y accesible.","easy":"Los inputs también se estilizan con utilidades: border, rounded, px, py, placeholder y estados focus.","daily":"Un formulario es como una conversación: cada pregunta necesita una etiqueta clara y una forma visible de responder.","behind":"El foco debe diferenciar el campo activo. La etiqueta label conecta significado y control.","remember":"Nunca uses placeholder como sustituto de label.","why":"El proyecto final tendrá una llamada a la acción con formulario simple.","files":[["index.html","Agrega sección de inscripción","edit"]],"steps":["Crea un form.","Agrega label conectado con for/id.","Agrega input type=email.","Usa focus:border y focus:ring.","Agrega botón submit con estados."],"code_file":"tailwind_academy/index.html","code":"<form class=\"rounded-2xl bg-slate-100 p-6\">\n  <label for=\"correo\" class=\"block text-sm font-bold text-slate-800\">Correo</label>\n  <input id=\"correo\" type=\"email\" class=\"mt-2 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100\" placeholder=\"nombre@correo.com\">\n  <button class=\"mt-4 rounded-xl bg-slate-950 px-5 py-3 font-bold text-white\">Inscribirme</button>\n</form>","check":"Al usar Tab el input y el botón deben tener un estado de foco identificable.","activity":"Agrega un campo de nombre y organiza ambos campos con grid en pantallas medianas.","extra":"type=email aporta validación básica del navegador, pero no sustituye validación real cuando exista backend.","preview":"<form class=\"rounded-2xl bg-slate-100 p-5\"><label class=\"block text-sm font-bold\">Correo</label><input class=\"mt-2 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100\" placeholder=\"nombre@correo.com\"><button class=\"mt-4 rounded-xl bg-slate-950 px-5 py-3 font-bold text-white\">Inscribirme</button></form>","properties":[{"name":"appearance","family":"appearance-none / appearance-auto","css":"appearance: none;","what":"Controla si el navegador dibuja el aspecto nativo de ciertos controles.","values":"appearance-none, appearance-auto.","when":"Selects, inputs y controles cuando necesitas diseño completamente personalizado.","pitfall":"Quitar apariencia nativa sin reconstruir señales importantes como flecha de select o foco.","example":"<select class=\"appearance-none\">...</select>","preview":"<div class=\"text-sm text-slate-600\">appearance-none elimina parte del estilo nativo; úsalo con cuidado.</div>"},{"name":"accent-color","family":"accent-*","css":"accent-color: var(--color-cyan-500);","what":"Cambia el color de acento de controles nativos compatibles como checkbox y radio.","values":"accent-cyan-500, accent-emerald-500, accent-auto.","when":"Checkboxes/radios sin reinventarlos con CSS complejo.","pitfall":"Reemplazar controles nativos innecesariamente cuando accent-* ya resuelve la identidad visual.","example":"<input type=\"checkbox\" class=\"accent-cyan-500\">","preview":"<label class=\"flex items-center gap-2\"><input checked type=\"checkbox\" class=\"size-5 accent-cyan-500\"> Opción</label>"},{"name":"caret-color","family":"caret-*","css":"caret-color: var(--color-cyan-500);","what":"Controla el color del cursor de escritura dentro de inputs/textareas.","values":"caret-cyan-500, caret-transparent, caret-current.","when":"Detalles de marca en campos de texto.","pitfall":"Confundir caret con el borde del input. Solo cambia el cursor de inserción.","example":"<input class=\"caret-cyan-500\">","preview":"<input class=\"w-full rounded border p-2 caret-cyan-500\" placeholder=\"Haz clic y escribe\">"},{"name":"placeholder color","family":"placeholder:*","css":"::placeholder { ... }","what":"Permite aplicar utilidades al texto placeholder.","values":"placeholder:text-slate-400, placeholder:italic, placeholder:opacity-*","when":"Pistas dentro de inputs sin competir con el valor real.","pitfall":"Usar placeholder como sustituto de label. No es accesible ni persistente al escribir.","example":"<input class=\"placeholder:text-slate-400\">","preview":"<input class=\"w-full rounded border p-2 placeholder:text-slate-400\" placeholder=\"correo@ejemplo.com\">"},{"name":"resize","family":"resize-*","css":"resize: vertical;","what":"Controla si un textarea puede redimensionarse manualmente.","values":"resize, resize-none, resize-x, resize-y.","when":"Textareas donde deseas permitir solo crecimiento vertical.","pitfall":"Deshabilitar resize en campos largos y dejar al usuario sin forma de ampliar el área.","example":"<textarea class=\"resize-y\"></textarea>","preview":"<textarea class=\"w-full resize-y rounded border p-2\" rows=\"2\">resize-y</textarea>"}]},{"id":"theme","group":"Intermedio","title":"Tema personalizado con @theme","subtitle":"Crea nombres de diseño propios sin salir de Tailwind v4.","easy":"Las theme variables permiten definir tokens como colores, fuentes o breakpoints que luego generan utilidades.","daily":"En una marca real no dices “azul parecido” cada vez; defines un color de marca y lo reutilizas.","behind":"@theme conecta variables de diseño con utilidades como bg-brand-500 o text-brand-700.","remember":"Un token expresa intención y ayuda a mantener consistencia.","why":"Hasta ahora usamos cyan; ahora convertiremos la identidad del proyecto en un tema explícito.","files":[["src/input.css","Define variables de tema","edit"],["index.html","Reemplaza algunas utilidades por brand-*","edit"]],"steps":["Abre src/input.css.","Debajo del import agrega @theme.","Define --color-brand-500 y --color-brand-700.","Usa bg-brand-500 y text-brand-700 en index.html."],"code_file":"tailwind_academy/src/input.css","code":"@import \"tailwindcss\";\n\n@theme {\n  --color-brand-500: #06b6d4;\n  --color-brand-700: #0e7490;\n}\n\n/* Después puedes usar bg-brand-500, text-brand-700, etc. */","check":"Al cambiar --color-brand-500 en un solo lugar, los elementos que usan bg-brand-500 deben reflejar el nuevo color.","activity":"Crea un color accent y úsalo solo para etiquetas o indicadores secundarios.","extra":"El tema debe reducir inconsistencias, no convertirse en una lista enorme de valores personalizados.","preview":"<div class=\"flex gap-3\"><div class=\"h-16 flex-1 rounded-xl bg-cyan-500\"></div><div class=\"h-16 flex-1 rounded-xl bg-cyan-700\"></div><div class=\"h-16 flex-1 rounded-xl bg-slate-950\"></div></div>","properties":[{"name":"color token","family":"--color-*","css":"@theme { --color-brand-500: ...; }","what":"Crea un token que genera utilidades relacionadas con color, como bg-brand-500 y text-brand-500.","values":"Cualquier nombre bajo --color-*; conviene usar una escala consistente.","when":"Identidad de marca y paletas de producto.","pitfall":"Definir colores de marca como variables :root esperando que Tailwind cree utilidades automáticamente. Para generar utilidades usa @theme.","example":"@theme { --color-brand-500: oklch(...); }","preview":"<div class=\"rounded bg-cyan-500 p-3 font-bold\">Un --color-* crea familias de utilidades de color.</div>"},{"name":"spacing token","family":"--spacing o --spacing-*","css":"@theme { --spacing: 0.25rem; }","what":"Controla la escala usada por muchas utilidades de espacio y tamaño.","values":"--spacing base y tokens de spacing según el sistema de diseño.","when":"Sistemas de diseño con ritmo espacial propio.","pitfall":"Cambiar la escala global sin revisar que afectará padding, margin, width y más familias.","example":"@theme { --spacing: 0.25rem; }","preview":"<div class=\"text-sm text-slate-600\">La escala espacial alimenta clases como p-4, gap-6 y w-16.</div>"},{"name":"font token","family":"--font-*","css":"@theme { --font-display: ...; }","what":"Crea utilidades de familia tipográfica como font-display.","values":"--font-sans, --font-serif, --font-mono o nombres propios.","when":"Tipografía de marca y separación entre texto UI y títulos.","pitfall":"Definir una fuente que no se ha cargado mediante @font-face o proveedor web.","example":"@theme { --font-display: \"Inter\", sans-serif; }","preview":"<div class=\"font-sans\">Los tokens font-* generan utilidades font-*</div>"},{"name":"breakpoint token","family":"--breakpoint-*","css":"@theme { --breakpoint-3xl: 120rem   const propCopy=document.querySelector('[data-prop-code]');
  if(propCopy&&p)propCopy.onclick=async(e)=>{await navigator.clipboard.writeText(p.example);e.currentTarget.textContent='Copiado ✓';setTimeout(()=>e.currentTarget.textContent='Copiar',1200)};
  renderNav(document.getElementById('search').value);updateProgress();window.scrollTo({top:0,behavior:'instant'});document.getElementById('sidebar').classList.remove('open');
}
function updateProgress(){const pct=Math.round(done.size/LESSONS.length*100);document.getElementById('progressText').textContent=`${pct}%`;document.getElementById('progressBar').style.width=pct+'%';}
document.getElementById('search').addEventListener('input',e=>renderNav(e.target.value));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('themeBtn').onclick=()=>{document.documentElement.classList.toggle('ui-dark');localStorage.setItem(THEME_KEY,document.documentElement.classList.contains('ui-dark')?'dark':'light')};
if(localStorage.getItem(THEME_KEY)==='dark')document.documentElement.classList.add('ui-dark');
window.addEventListener('hashchange',render);updateProgress();renderNav();render();
</script>
</body>
</html>
