ont-size:12px;font-weight:800}.bar{height:7px;background:var(--line);border-radius:999px;margin-top:9px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#0891b2);border-radius:inherit}.main{margin-left:var(--sidebar);min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:64px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.crumb{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px}.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}.icon-btn:hover{background:var(--panel2)}.mobile-menu{display:none}.content{max-width:1120px;margin:0 auto;padding:42px 34px 90px}.kicker{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--brand2)}.chapter-title{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.045em;margin:10px 0 14px;font-weight:1000;max-width:900px}.subtitle{font-size:18px;color:var(--muted);line-height:1.7;max-width:780px}.status-row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 13px;font-weight:800;font-size:12px;cursor:pointer}.pill-btn.done{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.section-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 8px 30px rgba(15,23,42,.03)}.section-label{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:var(--brand2);margin-bottom:16px}.explain-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--panel2)}.mini .em f5;color:#065f46;border-radius:0 14px 14px 0;padding:15px 17px;font-size:14px;line-height:1.6}.ui-dark .check{background:#052e2b;color:#a7f3d0}.activity{background:var(--yellow);border:1px solid var(--yellow-line);border-radius:18px;padding:20px;margin:20px 0}.activity h3{margin:0 0 8px;font-size:15px}.activity p{margin:5px 0;color:color-mix(in srgb,var(--text) 78%,#a16207);line-height:1.6}.nextprev{display:flex;justify-content:space-between;gap:14px;margin-top:32px}.nav-btn{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:15px 17px;font-weight:850;cursor:pointer;text-align:left}.nav-btn:last-child{text-align:right}.nav-btn:hover{border-color:var(--brand)}.refs{margin-top:36px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.7}.refs a{color:var(--brand2);font-weight:800}.empty{padding:30px;text-align:center;color:var(--muted)}

    .property-intro{margin:-3px 0 16px;color:var(--muted);font-size:14px;line-height:1.7}.property-shell{border:1px solid var(--line);border-radius:20px;background:var(--panel);overflow:hidden}.property-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--panel),var(--panel2))}.property-count{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--panel);font-size:11px;font-weight:900;color:var(--brand2);white-space:nowrap}.prop-name{font-size:clamp(24px,4vw,38px);font-weight:1000;letter-spacing:-.035em;line-height:1.05;margin:4px 0 8px}.prop-family{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--brand2)}.prop-body{padding:20px}.prop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:2px 0 14px}.prop-cell{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2)}.prop-cell b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--brand2);margin-bottom:5px}.prop-cell p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.prop-code{border-radius:12px;background:var(--code);color:#dbeafe;padding:14px 16px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto;margin:10px 0}.prop-preview{border:1px dashed var(--line);border-radius:12px;padding:18px;background:var(--panel);margin-top:10px}.prop-warning{border-left:3px solid #f59e0b;background:#fffbeb;color:#92400e;padding:11px 13px;border-radius:0 10px 10px 0;font-size:13px;line-height:1.6}.ui-dark .prop-warning{background:#2b2108;color:#fde68a}.property-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}.prop-step-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 12px;font-size:12px;font-weight:850;cursor:pointer}.prop-step-btn:hover{border-color:var(--brand);background:var(--panel2)}.prop-step-btn[disabled]{opacity:.4;cursor:not-allowed}.prop-practice{margin-top:14px;border:1px solid #fde68a;background:#fffbeb;color:#854d0e;border-radius:13px;padding:13px 15px;font-size:13px;line-height:1.65}.ui-dark .prop-practice{background:#2b2408;color:#fde68a;border-color:#854d0e}.nav-props{margin:2px 0 10px 38px;padding-left:10px;border-left:2px solid var(--line)}.nav-prop-link{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;color:var(--muted);font-size:12px;margin:1px 0}.nav-prop-link:hover{background:var(--panel2);color:var(--text)}.nav-prop-link.active{background:rgba(6,182,212,.10);color:var(--brand2);font-weight:850}.nav-prop-link .dot{width:6px;height:6px;border-radius:999px;background:var(--line);flex:none}.nav-prop-link.active .dot{background:var(--brand)}.lesson-context{margin-top:18px}.lesson-context summary{cursor:pointer;font-weight:900;color:var(--brand2)}.lesson-context[open] summary{margin-bottom:14px}@media(max-width:700px){.prop-grid{grid-template-columns:1fr}.property-head{flex-direction:column}.property-count{align-self:flex-start}.nav-props{margin-left:28px}}

<script>
const LESSONS = [{"id":"inicio","group":"Inicio","title":"Tailwind CSS desde cero hasta una interfaz completa","subtitle":"Conoce qué vas a construir y cómo estudiar la guía.","easy":"Tailwind CSS te permite diseñar una página usando clases pequeñas directamente en el HTML. La guía no busca que memorices cientos de clases: aprenderás a reconocer patrones y a probar cambios.","daily":"Piensa en una caja de piezas LEGO: una pieza controla el color, otra el espacio, otra el tamaño y otra la posición. Juntas construyen el diseño.","behind":"Tailwind lee las clases que escribes y genera únicamente el CSS que tu proyecto necesita. En las primeras prácticas usaremos el Play CDN; después pasaremos a una instalación real.","remember":"Cada lección modifica el mismo proyecto: tailwind_academy.","why":"Primero necesitas visualizar el resultado final para entender por qué cada tema aparece en la ruta de aprendizaje.","files":[["README.md","Define el objetivo del proyecto","edit"]],"steps":["Crea una carpeta llamada tailwind_academy.","Dentro crea README.md.","Escribe que construirás una página de cursos.","Conserva siempre la misma carpeta: no empezarás un proyecto nuevo en cada capítulo."],"code_file":"tailwind_academy/README.md","code":"# Tailwind Academy\n\nProyecto progresivo para aprender Tailwind CSS.\n\nObjetivo: construir una página de cursos moderna, responsive y accesible.","check":"Puedes explicar qué proyecto construirás y por qué todas las lecciones modifican la misma carpeta.","activity":"Dibuja en una hoja cómo imaginas la página final: barra superior, portada, tarjetas de cursos y pie de página.","extra":"Al final vuelve al dibujo y compáralo con el resultado real.","preview":"<div class=\"rounded-2xl bg-slate-950 p-5 text-white shadow-xl\"><div class=\"text-xs font-bold text-cyan-300\">PROYECTO FINAL</div><div class=\"mt-2 text-2xl font-black\">Tailwind Academy</div><div class=\"mt-4 grid grid-cols-3 gap-2\"><div class=\"rounded-lg bg-slate-800 p-3\">HTML</div><div class=\"rounded-lg bg-slate-800 p-3\">CSS</div><div class=\"rounded-lg bg-cyan-500 p-3 text-slate-950\">Tailwind</div></div></div>","properties":[]},{"id":"antes-tailwind","group":"Fundamentos","title":"Antes de Tailwind: HTML y CSS","subtitle":"Entiende qué problema resuelve Tailwind antes de usarlo.","easy":"HTML crea la estructura y CSS define su apariencia. Tailwind no reemplaza HTML y tampoco elimina CSS: ofrece clases utilitarias que producen reglas CSS de forma consistente.","daily":"En CSS tradicional podrías crear una clase .tarjeta y escribir muchas propiedades. Con Tailwind puedes combinar clases como p-6, rounded-xl y shadow-lg.","behind":"Cada utilidad de Tailwind representa una o varias reglas CSS pequeñas. Por ejemplo, p-4 agrega padding y text-center alinea texto.","remember":"HTML = estructura. CSS = estilos. Tailwind = una forma organizada de aplicar estilos con utilidades.","why":"Si el estudiante no diferencia estructura de apariencia, después las utilidades se sienten como palabras mágicas.","files":[["README.md","Agrega una comparación entre CSS tradicional y utilidades","edit"]],"steps":["Recuerda qué hace HTML.","Recuerda qué hace CSS.","Compara una clase CSS tradicional con varias utilidades de Tailwind.","Identifica qué parte es estructura y qué parte es presentación."],"code_file":"tailwind_academy/README.md","code":"CSS tradicional:\n.tarjeta {\n  padding: 1.5rem;\n  border-radius: 1rem;\n  box-shadow: 0 10px 25px rgba(0,0,0,.12);\n}\n\nIdea equivalente en Tailwind:\n<div class=\"p-6 rounded-2xl shadow-xl\">...</div>","check":"Puedes mirar una clase como p-6 o rounded-2xl y decir qué aspecto visual controla.","activity":"Toma tres propiedades CSS que ya conozcas y busca qué utilidad de Tailwind cumple una función parecida.","extra":"No intentes memorizar todas las utilidades todavía; aprende a leerlas por familias.","preview":"<div class=\"grid gap-3 md:grid-cols-2\"><div class=\"rounded-xl border border-slate-200 p-4\"><b>CSS tradicional</b><p class=\"mt-2 text-sm text-slate-500\">Creas una clase y escribes sus propiedades.</p></div><div class=\"rounded-xl border border-cyan-200 bg-cyan-50 p-4\"><b>Tailwind</b><p class=\"mt-2 text-sm text-slate-600\">Combinas utilidades pequeñas directamente en el elemento.</p></div></div>","properties":[]},{"id":"utility-first","group":"Fundamentos","title":"La idea Utility-First","subtitle":"Aprende a leer una cadena de clases sin memorizarla.","easy":"En Tailwind, muchas decisiones visuales se expresan con utilidades pequeñas: bg-* para fondo, text-* para texto, p-* para padding, m-* para margin y rounded-* para bordes redondeados.","daily":"Es como describir una caja: “fondo azul, texto blanco, espacio interno grande, esquinas redondas”. Cada frase se convierte en una utilidad.","behind":"El navegador recibe CSS generado por Tailwind; las clases siguen siendo clases CSS normales desde el punto de vista del HTML.","remember":"Lee una cadena de izquierda a derecha por familias: color, tipografía, espacio, borde, efecto y estado.","why":"Esta forma de lectura evita que las clases largas parezcan desordenadas.","files":[["README.md","Documenta las primeras familias de utilidades","edit"]],"steps":["Escribe cinco familias: bg, text, p, m y rounded.","Asocia cada familia con una responsabilidad visual.","Lee el ejemplo sin ejecutarlo.","Predice cómo se verá y luego compáralo con la vista previa."],"code_file":"Ejemplo de lectura","code":"<button class=\"bg-cyan-500 text-slate-950 px-5 py-3 rounded-xl font-bold shadow-lg\">\n  Empezar curso\n</button>","check":"Puedes explicar que px controla el espacio horizontal, py el vertical y bg el fondo.","activity":"Cambia mentalmente bg-cyan-500 por bg-violet-500 y rounded-xl por rounded-full. ¿Qué esperas que cambie?","extra":"Las clases pueden ser muchas, pero cada una debe tener una razón.","preview":"<button class=\"bg-cyan-500 text-slate-950 px-5 py-3 rounded-xl font-bold shadow-lg\">Empezar curso</button>","properties":[{"name":"Familia bg-*","family":"background-color","css":"background-color: ...;","what":"bg-* responde a la propiedad CSS background-color.","values":"bg-cyan-500, bg-white, bg-transparent.","when":"Cuando quieras cambiar el fondo.","pitfall":"Leer bg-cyan-500 como una palabra misteriosa en vez de separarlo: bg = fondo; cyan = paleta; 500 = tono.","example":"<div class=\"bg-cyan-500\">...</div>","preview":"<div class=\"rounded bg-cyan-500 p-3 font-bold\">bg = fondo</div>"},{"name":"Familia p-*","family":"padding","css":"padding: ...;","what":"p-* corresponde al espacio interior.","values":"p-4, px-6, py-2, pt-8.","when":"Para separar contenido del borde de su propia caja.","pitfall":"Confundir p con m: padding es interior; margin es exterior.","example":"<div class=\"p-4\">...</div>","preview":"<div class=\"border border-cyan-500 p-4\">p-4 deja espacio dentro del borde</div>"},{"name":"Familia rounded-*","family":"border-radius","css":"border-radius: ...;","what":"rounded-* corresponde al redondeo de esquinas.","values":"rounded, rounded-lg, rounded-2xl, rounded-full.","when":"Botones, tarjetas y avatares.","pitfall":"Pensar que rounded-full siempre crea un círculo; depende también de ancho/alto.","example":"<div class=\"rounded-xl\">...</div>","preview":"<div class=\"rounded-2xl bg-slate-100 p-3\">rounded-2xl</div>"}]},{"id":"html-base","group":"Fundamentos","title":"Prepara el HTML base","subtitle":"Crea la estructura mínima antes de instalar Tailwind.","easy":"Antes de añadir estilos, crea un documento HTML correcto con head, viewport y body. Así podrás distinguir problemas de estructura de problemas de Tailwind.","daily":"Es como construir primero la pared antes de pintarla.","behind":"El viewport permite que el navegador adapte el ancho correctamente en móviles. Sin él, el responsive puede parecer roto.","remember":"Primero estructura; después estilos.","why":"La página base será el archivo que seguiremos enriqueciendo durante el curso.","files":[["index.html","Documento HTML inicial","new"]],"steps":["Crea index.html en la raíz.","Agrega doctype, idioma y meta viewport.","Escribe un h1 y un párrafo sin clases.","Abre el archivo en el navegador para comprobar que HTML funciona antes de Tailwind."],"code_file":"tailwind_academy/index.html","code":"<!doctype html>\n<html lang=\"es\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Tailwind Academy</title>\n</head>\n<body>\n  <h1>Tailwind Academy</h1>\n  <p>Aprende construyendo una interfaz real.</p>\n</body>\n</html>","check":"La página debe abrir sin errores y mostrar un título y un párrafo sin estilos especiales.","activity":"Agrega un segundo párrafo explicando qué esperas aprender con Tailwind.","extra":"Si algo falla aquí, todavía no es un problema de Tailwind.","preview":"<div class=\"rounded-xl border border-dashed border-slate-300 bg-white p-6\"><h3 class=\"text-2xl font-bold\">Tailwind Academy</h3><p class=\"mt-2 text-slate-500\">Primero comprobamos el HTML.</p></div>","properties":[]},{"id":"play-cdn","group":"Instalación","title":"Primera prueba con Play CDN","subtitle":"Usa Tailwind sin instalar nada para comprender las utilidades.","easy":"El Play CDN permite usar Tailwind directamente en el navegador. Es perfecto para aprender y prototipar, pero no está pensado para producción.","daily":"Es como probar una herramienta prestada antes de comprar tu propio kit.","behind":"El script del navegador procesa las clases de Tailwind y genera estilos mientras desarrollas.","remember":"Play CDN = aprendizaje rápido. Instalación local = proyecto real.","why":"Primero queremos ver Tailwind funcionando con la menor cantidad de pasos posible.","files":[["index.html","Agrega el script del Play CDN y primeras clases","edit"]],"steps":["Abre index.html.","Dentro de head agrega el script del navegador de Tailwind.","Agrega clases al body y al h1.","Recarga y comprueba que el aspecto cambió."],"code_file":"tailwind_academy/index.html","code":"<script src=\"https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4\"><\/script>\n\n<body class=\"bg-slate-950 text-white min-h-screen p-8\">\n  <h1 class=\"text-4xl font-black text-cyan-400\">Tailwind Academy</h1>\n  <p class=\"mt-3 text-slate-300\">Mi primera página con utilidades.</p>\n</body>","check":"Debes ver fondo oscuro, título grande color cian y separación entre el título y el párrafo.","activity":"Cambia bg-slate-950 por bg-white y adapta el color del texto para que siga siendo legible.","extra":"No uses Play CDN como solución final del proyecto.","preview":"<div class=\"rounded-2xl bg-slate-950 p-6 text-white\"><h3 class=\"text-3xl font-black text-cyan-400\">Tailwind Academy</h3><p class=\"mt-3 text-slate-300\">Ya estamos usando utilidades.</p></div>","properties":[]},{"id":"cli","group":"Instalación","title":"Instalación con Tailwind CLI","subtitle":"Aprende el flujo local sin depender del CDN.","easy":"El CLI observa tus archivos, detecta clases y escribe un CSS compilado. Este flujo es útil cuando trabajas con HTML sencillo y quieres un build real.","daily":"Piensa en una máquina que revisa tus piezas y fabrica solo el CSS necesario.","behind":"input.css importa Tailwind; el CLI genera output.css. El HTML enlaza output.css como cualquier hoja de estilos.","remember":"Entrada: input.css. Proceso: CLI. Salida: output.css.","why":"Te enseña claramente qué archivo entra y cuál sale antes de introducir Vite.","files":[["package.json","Se crea al inicializar npm","new"],["src/input.css","Importa Tailwind","new"],["src/output.css","Lo genera el CLI; no lo escribes a mano","generated"],["index.html","Enlaza el CSS generado","edit"]],"steps":["En la terminal ejecuta node --version y npm --version. Si no existen, instala Node.js. Para Vite 8 usa Node.js 20.19+ o 22.12+.","Entra a tailwind_academy.","Ejecuta npm init -y.","Instala tailwindcss y @tailwindcss/cli.","Crea src/input.css con @import \"tailwindcss\".","Ejecuta el watcher del CLI.","En index.html enlaza src/output.css."],"code_file":"Terminal + src/input.css","code":"npm init -y\nnpm install tailwindcss @tailwindcss/cli\n\n# src/input.css\n@import \"tailwindcss\";\n\n# compilar mientras trabajas\nnpx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch","check":"Mientras el watcher está abierto, al agregar una utilidad nueva al HTML el archivo output.css debe actualizarse.","activity":"Agrega text-violet-500 a un elemento y verifica que el cambio aparezca sin escribir CSS manual.","extra":"No edites output.css: es un archivo generado.","preview":"<div class=\"grid gap-2 text-sm\"><div class=\"rounded-lg bg-slate-900 p-3 font-mono text-cyan-300\">input.css → CLI → output.css</div><div class=\"rounded-lg border border-slate-200 p-3\">El HTML usa el CSS compilado.</div></div>","properties":[]},{"id":"vite","group":"Instalación","title":"Instalación recomendada con Vite","subtitle":"Configura Tailwind v4 con el plugin oficial para Vite.","easy":"Vite ofrece un servidor de desarrollo rápido y un proceso de build. Tailwind se integra mediante @tailwindcss/vite.","daily":"Es como cambiar de una herramienta manual a un banco de trabajo que automatiza varias tareas.","behind":"Vite procesa index.html y los recursos; el plugin de Tailwind integra la generación de CSS dentro de ese flujo.","remember":"Para el resto del curso usaremos Vite + @tailwindcss/vite.","why":"Este será el entorno definitivo del proyecto progresivo.","files":[["package.json","Dependencias y scripts","new"],["vite.config.js","Activa el plugin de Tailwind","new"],["src/input.css","Importa Tailwind","new"],["index.html","Página principal","edit"]],"steps":["Si vienes del ejemplo CDN, crea una copia de seguridad.","Crea un proyecto Vite vanilla o adapta tu carpeta actual.","Instala tailwindcss y @tailwindcss/vite.","Configura vite.config.js.","Mantén @import \"tailwindcss\" en src/input.css.","Ejecuta npm run dev."],"code_file":"vite.config.js","code":"import { defineConfig } from \"vite\";\nimport tailwindcss from \"@tailwindcss/vite\";\n\nexport default defineConfig({\n  plugins: [tailwindcss()],\n});\n\n// Terminal\n// npm install tailwindcss @tailwindcss/vite\n// npm run dev","check":"La terminal debe mostrar una URL local de Vite y las clases de Tailwind deben verse en el navegador.","activity":"Cierra el servidor, vuelve a iniciarlo y confirma que recuerdas qué comando levanta el proyecto.","extra":"En Tailwind v4 el flujo básico puede funcionar sin crear tailwind.config.js.","preview":"<div class=\"rounded-2xl border border-emerald-200 bg-emerald-50 p-5\"><div class=\"font-bold text-emerald-800\">Vite + Tailwind</div><p class=\"mt-2 text-sm text-emerald-700\">Servidor de desarrollo + generación de estilos integrada.</p></div>","properties":[]},{"id":"estructura","group":"Instalación","title":"Estructura del proyecto","subtitle":"Ubícate antes de tocar código.","easy":"Saber dónde está cada archivo evita mezclar configuración, estilos y contenido.","daily":"Como un taller: cada herramienta tiene un cajón y cada material tiene un lugar.","behind":"Vite parte de index.html. Tailwind se importa desde src/input.css. vite.config.js registra el plugin.","remember":"Cuando una lección diga “archivo exacto”, vuelve a este mapa.","why":"La estructura será estable mientras el contenido de index.html y input.css va creciendo.","files":[["index.html","Interfaz principal","edit"],["src/input.css","Tailwind y personalizaciones","edit"],["vite.config.js","Configuración de Vite","keep"],["package.json","Dependencias y scripts","keep"]],"steps":["Comprueba que existen los cuatro archivos.","Abre cada uno y describe su responsabilidad.","No pongas HTML dentro de input.css.","No pongas utilidades de Tailwind dentro de vite.config.js."],"code_file":"Estructura esperada","code":"tailwind_academy/\n├── index.html\n├── package.json\n├── vite.config.js\n└── src/\n    └── input.css","check":"Puedes decir exactamente dónde agregarías HTML, dónde personalizarías Tailwind y dónde configurarías Vite.","activity":"Sin mirar la guía, dibuja el árbol de archivos y luego compáralo.","extra":"Cuando el proyecto crezca podrás añadir imágenes o JavaScript, pero no los necesitamos todavía.","preview":"<div class=\"rounded-xl bg-slate-950 p-4 font-mono text-sm text-slate-200\"><div>📁 tailwind_academy</div><div class=\"pl-4\">├─ index.html</div><div class=\"pl-4\">├─ package.json</div><div class=\"pl-4\">├─ vite.config.js</div><div class=\"pl-4\">└─ 📁 src</div><div class=\"pl-8\">└─ input.css</div></div>","properties":[]},{"id":"tipografia-colores","group":"Utilidades","title":"Colores y tipografía, propiedad por propiedad","subtitle":"Separa fondo, color de texto, tamaño, peso, alineación, interlineado y espaciado entre letras.","easy":"En Tailwind no existe una única clase llamada “tipografía”. Cada decisión corresponde a una propiedad CSS diferente. En esta lección estudiarás cada una por separado y luego las combinarás.","daily":"En un cartel eliges fondo, tamaño del título y contraste. Aquí haces esas decisiones con clases.","behind":"Clases como text-5xl, font-black y tracking-tight se convierten en reglas tipográficas. Los colores siguen una escala de intensidad.","remember":"No confundas text-4xl (tamaño) con text-cyan-400 (color). El prefijo puede compartir nombre pero la escala revela su función.","why":"La portada necesita una jerarquía clara antes de añadir layouts complejos.","files":[["index.html","Estiliza el hero del proyecto","edit"]],"steps":["Crea una etiqueta pequeña con el nombre del curso.","Agrega un h1 grande.","Agrega un párrafo de apoyo con menos contraste.","Prueba dos colores y elige el que conserve buena legibilidad."],"code_file":"tailwind_academy/index.html","code":"<section class=\"bg-slate-950 text-white p-8\">\n  <span class=\"text-sm font-bold uppercase tracking-widest text-cyan-400\">Tailwind Academy</span>\n  <h1 class=\"mt-3 text-5xl font-black tracking-tight\">Diseña sin salir del HTML</h1>\n  <p class=\"mt-4 max-w-2xl text-lg text-slate-300\">Aprende utilidades mientras construyes una página real.</p>\n</section>","check":"El título debe dominar visualmente y el párrafo debe ser fácil de leer sin competir con él.","activity":"Crea una segunda versión usando una paleta violeta y compara cuál se entiende mejor.","extra":"El color también comunica jerarquía, no solo decoración.","preview":"<div class=\"rounded-2xl bg-slate-950 p-6 text-white\"><div class=\"text-xs font-bold uppercase tracking-widest text-cyan-400\">Tailwind Academy</div><h3 class=\"mt-2 text-3xl font-black tracking-tight\">Diseña sin salir del HTML</h3><p class=\"mt-3 text-slate-300\">Jerarquía con tamaño, peso y contraste.</p></div>","properties":[{"name":"background-color","family":"bg-*","css":"background-color: var(--color-cyan-500);","what":"Cambia el color de fondo de la caja. No cambia el color del texto.","values":"bg-white, bg-slate-950, bg-cyan-500, bg-transparent, bg-current. Las escalas de color suelen ir de 50 a 950.","when":"Fondos de páginas, tarjetas, botones, avisos y secciones.","pitfall":"Confundir bg-* con text-*. bg-* pinta la caja; text-* pinta el contenido textual.","example":"<div class=\"bg-cyan-500 p-4\">Fondo cian</div>","preview":"<div class=\"rounded-xl bg-cyan-500 p-4 font-bold text-slate-950\">bg-cyan-500</div>"},{"name":"color","family":"text-{color}","css":"color: var(--color-slate-700);","what":"Cambia el color del texto y, por herencia, puede afectar a hijos que no tengan su propio color.","values":"text-black, text-white, text-slate-600, text-cyan-500, text-current.","when":"Títulos, párrafos, enlaces, estados y etiquetas.","pitfall":"text-* también se usa para tamaño, por ejemplo text-xl. Debes leer lo que aparece después de text-.","example":"<p class=\"text-slate-600\">Texto secundario</p>","preview":"<p class=\"text-slate-600\">Este texto usa <b>text-slate-600</b>.</p>"},{"name":"font-size","family":"text-xs … text-9xl","css":"font-size: var(--text-2xl);","what":"Controla el tamaño de las letras. Es diferente de font-weight, que controla el grosor.","values":"text-xs, text-sm, text-base, text-lg, text-xl, text-2xl … text-9xl. También text-[18px].","when":"Jerarquía visual: etiquetas pequeñas, cuerpo de texto, subtítulos y títulos.","pitfall":"Usar tamaños enormes para “dar importancia” sin mantener una jerarquía consistente.","example":"<h2 class=\"text-3xl\">Título</h2>","preview":"<div><div class=\"text-xs\">text-xs</div><div class=\"text-base\">text-base</div><div class=\"text-3xl font-bold\">text-3xl</div></div>"},{"name":"font-weight","family":"font-*","css":"font-weight: 700;","what":"Controla el grosor del trazo de las letras.","values":"font-thin, font-light, font-normal, font-medium, font-semibold, font-bold, font-extrabold, font-black.","when":"Destacar títulos, botones o fragmentos importantes sin cambiar su tamaño.","pitfall":"Creer que font-bold aumenta el tamaño. Solo modifica el peso.","example":"<p class=\"font-bold\">Importante</p>","preview":"<div class=\"space-y-1\"><div class=\"font-normal\">font-normal</div><div class=\"font-semibold\">font-semibold</div><div class=\"font-black\">font-black</div></div>"},{"name":"font-family","family":"font-sans / font-serif / font-mono","css":"font-family: var(--font-sans);","what":"Selecciona la familia tipográfica.","values":"font-sans, font-serif, font-mono o una familia propia creada con --font-* en @theme.","when":"Texto general, código, interfaces editoriales o identidad de marca.","pitfall":"Cambiar de familia sin revisar legibilidad, acentos, números y pesos disponibles.","example":"<code class=\"font-mono\">npm run dev</code>","preview":"<div class=\"grid gap-1\"><div class=\"font-sans\">Sans</div><div class=\"font-serif\">Serif</div><div class=\"font-mono\">Mono</div></div>"},{"name":"text-align","family":"text-left / center / right / justify","css":"text-align: center;","what":"Alinea el contenido de texto dentro de su caja. No centra la caja misma.","values":"text-left, text-center, text-right, text-justify, text-start, text-end.","when":"Encabezados, tablas, héroes y bloques de contenido.","pitfall":"Usar text-center esperando centrar un div. Para cajas normalmente usarás flex/grid/mx-auto.","example":"<h2 class=\"text-center\">Centrado</h2>","preview":"<div class=\"rounded-lg bg-slate-100 p-3 text-center\">text-center centra el texto</div>"},{"name":"line-height","family":"leading-*","css":"line-height: 1.625;","what":"Controla la separación vertical entre líneas de un mismo texto.","values":"leading-none, leading-tight, leading-snug, leading-normal, leading-relaxed, leading-loose o valores como leading-7.","when":"Párrafos, títulos multilínea y textos densos.","pitfall":"Confundir line-height con margin entre párrafos. leading afecta líneas del mismo elemento.","example":"<p class=\"leading-relaxed\">Un párrafo con varias líneas...</p>","preview":"<p class=\"max-w-sm leading-relaxed text-slate-600\">Esta frase tiene un interlineado más cómodo para lectura continua.</p>"},{"name":"letter-spacing","family":"tracking-*","css":"letter-spacing: 0.025em;","what":"Controla el espacio horizontal entre caracteres.","values":"tracking-tighter, tracking-tight, tracking-normal, tracking-wide, tracking-wider, tracking-widest.","when":"Etiquetas en mayúsculas, logotipos y ajustes finos de títulos.","pitfall":"Aplicar tracking-widest a párrafos largos; reduce la fluidez de lectura.","example":"<span class=\"tracking-widest uppercase\">Nuevo</span>","preview":"<span class=\"text-xs font-bold uppercase tracking-widest text-cyan-700\">tracking-widest</span>"},{"name":"text-decoration","family":"underline / line-through / no-underline","css":"text-decoration-line: underline;","what":"Añade o elimina subrayado o tachado.","values":"underline, overline, line-through, no-underline; decoration-* controla color/estilo/grosor.","when":"Enlaces, precios anteriores, estados completados.","pitfall":"Quitar el subrayado de enlaces sin añadir otra señal visual de que son interactivos.","example":"<a class=\"underline decoration-2 underline-offset-4\">Documentación</a>","preview":"<a href=\"#\" class=\"font-semibold text-cyan-700 underline decoration-2 underline-offset-4\">Enlace reconocible</a>"}]},{"id":"spacing-sizing","group":"Utilidades","title":"Margin, padding y tamaños, propiedad por propiedad","subtitle":"Diferencia espacio exterior, espacio interior, ancho, alto y límites mínimos/máximos.","easy":"p-* agrega espacio interno, m-* espacio externo, gap-* separa hijos y max-w-* limita el ancho. Tailwind usa una escala consistente.","daily":"Como acomodar muebles: no basta con que existan; necesitas distancia para que cada elemento respire.","behind":"Las escalas de spacing producen valores CSS coherentes. Esto reduce pequeñas diferencias accidentales entre secciones.","remember":"Primero busca una utilidad de la escala. Usa valores arbitrarios solo cuando el diseño realmente lo exija.","why":"El hero se veía bien, ahora necesita un ancho de lectura y separación consistentes.","files":[["index.html","Ajusta contenedor, padding y separación","edit"]],"steps":["Envuelve el contenido en max-w-6xl mx-auto.","Agrega px-6 para espacio lateral.","Usa py-20 para espacio vertical del hero.","Separa bloques con mt-* y gap-*."],"code_file":"tailwind_academy/index.html","code":"<section class=\"bg-slate-950 text-white\">\n  <div class=\"mx-auto max-w-6xl px-6 py-20\">\n    <h1 class=\"max-w-3xl text-5xl font-black\">Aprende Tailwind construyendo</h1>\n    <p class=\"mt-5 max-w-2xl text-lg text-slate-300\">El contenedor limita la línea de lectura y mantiene márgenes laterales.</p>\n  </div>\n</section>","check":"Al ampliar la ventana el contenido no debe pegarse a los bordes ni crecer indefinidamente.","activity":"Prueba max-w-3xl, max-w-5xl y max-w-7xl y observa cómo cambia la lectura.","extra":"mx-auto centra un elemento que tiene un ancho máximo.","preview":"<div class=\"rounded-2xl bg-slate-900 px-6 py-10 text-white\"><div class=\"mx-auto max-w-md rounded-xl border border-slate-700 p-5\">Espacio controlado con px, py, max-w y mx-auto.</div></div>","properties":[{"name":"margin","family":"m-*, mx-*, my-*, mt-*…","css":"margin: calc(var(--spacing) * 4);","what":"Crea espacio FUERA del borde del elemento; separa una caja de otras cajas.","values":"m-4 todos los lados; mx-4 eje inline; my-4 eje block; mt/mr/mb/ml por lado; m-auto; valores negativos como -mt-2.","when":"Separar secciones o centrar bloques con mx-auto cuando tienen un ancho limitado.","pitfall":"Usar margin para crear espacio interior. Para eso existe padding.","example":"<section class=\"mt-8\">...</section>","preview":"<div class=\"border border-dashed p-2\"><div class=\"m-4 rounded bg-cyan-100 p-2\">m-4: espacio exterior</div></div>"},{"name":"padding","family":"p-*, px-*, py-*, pt-*…","css":"padding: calc(var(--spacing) * 4);","what":"Crea espacio DENTRO del borde entre el contenido y el borde de la caja.","values":"p-4; px-6; py-3; pt/pr/pb/pl; utilidades lógicas ps/pe y, en v4.3, variantes block-start/block-end relacionadas.","when":"Botones, tarjetas, campos, secciones y cualquier caja que necesite respirar.","pitfall":"Aumentar padding para separar dos elementos hermanos; normalmente eso debe resolverse con gap o margin.","example":"<button class=\"px-5 py-3\">Guardar</button>","preview":"<button class=\"rounded-xl bg-slate-900 px-5 py-3 font-bold text-white\">px-5 + py-3</button>"},{"name":"width","family":"w-*","css":"width: calc(var(--spacing) * 64);","what":"Controla el ancho del elemento.","values":"w-16, w-64, w-full, w-screen, w-auto, w-1/2, w-fit, w-min, w-max, w-[320px].","when":"Imágenes, paneles, botones, barras y componentes con ancho definido.","pitfall":"Usar w-screen dentro de un contenedor y provocar scroll horizontal inesperado.","example":"<div class=\"w-64\">...</div>","preview":"<div class=\"h-10 w-64 rounded-lg bg-cyan-200\"></div>"},{"name":"height","family":"h-*","css":"height: calc(var(--spacing) * 16);","what":"Controla la altura de la caja.","values":"h-10, h-64, h-full, h-screen, h-dvh, h-auto, h-fit, h-[300px].","when":"Avatares, cabeceras, paneles, áreas hero y componentes cuadrados junto con w-*.","pitfall":"Forzar alturas fijas en contenido dinámico y terminar cortando texto.","example":"<div class=\"h-16\">...</div>","preview":"<div class=\"flex h-16 items-center rounded-lg bg-slate-200 px-4\">h-16</div>"},{"name":"min-width / max-width","family":"min-w-* / max-w-*","css":"max-width: var(--container-3xl);","what":"Define límites: la caja puede adaptarse, pero no pasar por debajo o por encima de cierto tamaño.","values":"min-w-0, min-w-full, max-w-sm, max-w-xl, max-w-3xl, max-w-full, max-w-none.","when":"Limitar líneas de lectura, formularios y layouts fluidos.","pitfall":"Usar w-full sin max-w-* en monitores grandes y terminar con párrafos demasiado largos.","example":"<main class=\"mx-auto max-w-3xl\">...</main>","preview":"<div class=\"mx-auto max-w-md rounded-xl border p-4\">max-w-md + mx-auto</div>"},{"name":"min-height / max-height","family":"min-h-* / max-h-*","css":"min-height: 100vh;","what":"Impone límites verticales sin obligar necesariamente a una altura exacta.","values":"min-h-screen, min-h-dvh, min-h-64, max-h-80, max-h-screen.","when":"Páginas que deben ocupar al menos la pantalla, paneles y listas con scroll.","pitfall":"Usar h-screen en móviles cuando min-h-dvh se ajusta mejor a barras dinámicas del navegador.","example":"<main class=\"min-h-screen\">...</main>","preview":"<div class=\"flex min-h-24 items-center rounded bg-slate-100 p-3\">min-h-24</div>"},{"name":"gap","family":"gap-*, gap-x-*, gap-y-*","css":"gap: calc(var(--spacing) * 4);","what":"Separa hijos dentro de un contenedor flex o grid sin añadir margin individual a cada hijo.","values":"gap-2, gap-4, gap-8, gap-x-6, gap-y-3.","when":"Menús, grids de tarjetas, botones agrupados y layouts con wrap.","pitfall":"Usar space-x-* en layouts que hacen wrap; gap suele ser más robusto.","example":"<div class=\"flex gap-4\">...</div>","preview":"<div class=\"flex gap-4\"><div class=\"rounded bg-cyan-100 p-3\">A</div><div class=\"rounded bg-cyan-100 p-3\">B</div><div class=\"rounded bg-cyan-100 p-3\">C</div></div>"}]},{"id":"display-visibility","group":"Utilidades","title":"Display y visibilidad: cómo se comporta una caja","subtitle":"Antes de Flexbox y Grid, aprende si un elemento ocupa línea completa, comparte línea o desaparece.","easy":"La propiedad display define el tipo de caja que crea un elemento y cómo participa en el layout. Tailwind la expresa con utilidades directas como block, inline, inline-block, hidden, flex y grid.","daily":"Imagina personas haciendo fila: block ocupa toda la fila, inline comparte la fila y hidden sale temporalmente de la sala.","behind":"HTML trae valores de display por defecto: div suele ser block y span suele ser inline. Tailwind puede sobrescribir ese comportamiento.","remember":"Display cambia el comportamiento de la caja. No es lo mismo que opacity:0 ni visibility:hidden.","why":"Necesitamos entender display antes de convertir contenedores en flex o grid.","files":[["index.html","Prueba distintos tipos de display","edit"]],"steps":["Crea tres elementos con contenido corto.","Prueba block, inline e inline-block.","Oculta uno con hidden.","Usa md:block junto con hidden para hacerlo responsive."],"code_file":"Fragmento para index.html","code":"<div class=\"block\">Soy block</div>\n<span class=\"inline\">Soy inline</span>\n<span class=\"inline-block p-2\">Soy inline-block</span>\n<div class=\"hidden md:block\">Aparezco desde md</div>","check":"Puedes explicar por qué block ocupa una fila, inline comparte línea y hidden no genera caja visible.","activity":"Crea un mensaje que esté oculto en móvil y aparezca desde md usando hidden md:block.","extra":"Prueba invisible y compáralo con hidden: observa que invisible conserva el espacio.","preview":"<div class=\"space-y-2\"><div class=\"block rounded bg-cyan-100 p-2\">block</div><span class=\"inline rounded bg-slate-100 p-1\">inline A</span> <span class=\"inline rounded bg-slate-100 p-1\">inline B</span></div>","properties":[{"name":"display: block","family":"block","css":"display: block;","what":"Crea una caja de bloque que normalmente comienza en una nueva línea y puede aceptar width/height.","values":"block.","when":"Secciones, contenedores y convertir elementos inline en bloques.","pitfall":"Creer que block significa ancho 100% de forma absoluta; su ancho auto normalmente llena el espacio disponible, pero depende del contexto.","example":"<a class=\"block\">Enlace bloque</a>","preview":"<div class=\"block rounded bg-cyan-100 p-2\">block</div>"},{"name":"display: inline","family":"inline","css":"display: inline;","what":"Hace que la caja participe en la misma línea que el texto circundante. Width/height no funcionan como en block.","values":"inline.","when":"Texto, enlaces y fragmentos dentro de párrafos.","pitfall":"Intentar controlar width/height de un inline como si fuera block.","example":"<span class=\"inline\">texto</span>","preview":"Texto antes <span class=\"inline rounded bg-cyan-100 px-1\">inline</span> texto después."},{"name":"display: inline-block","family":"inline-block","css":"display: inline-block;","what":"Comparte línea como inline, pero admite dimensiones y padding como una caja block.","values":"inline-block.","when":"Badges, botones y piezas pequeñas en línea.","pitfall":"Usarlo para layouts complejos donde Flexbox sería más claro.","example":"<span class=\"inline-block h-8 w-20\">...</span>","preview":"<span class=\"inline-block h-8 w-24 rounded bg-cyan-200 text-center leading-8\">inline-block</span>"},{"name":"display: none","family":"hidden","css":"display: none;","what":"El elemento no se renderiza en el layout y deja de ocupar espacio.","values":"hidden; combínalo con breakpoints como hidden md:block.","when":"Menús responsive, contenido condicional y elementos no disponibles en cierto layout.","pitfall":"Confundir hidden con invisible. invisible conserva el espacio; hidden no.","example":"<div class=\"hidden md:block\">...</div>","preview":"<div class=\"rounded bg-slate-100 p-2\">El ejemplo oculto no ocupa espacio.</div>"},{"name":"visibility","family":"visible / invisible / collapse","css":"visibility: hidden;","what":"Oculta la pintura del elemento pero normalmente conserva su espacio en el layout.","values":"visible, invisible, collapse.","when":"Ocultar temporalmente sin recalcular completamente el espacio.","pitfall":"Usar invisible esperando que los elementos vecinos ocupen el hueco.","example":"<div class=\"invisible\">...</div>","preview":"<div class=\"grid grid-cols-3 gap-2\"><div class=\"bg-slate-100 p-2\">1</div><div class=\"invisible bg-cyan-100 p-2\">2</div><div class=\"bg-slate-100 p-2\">3</div></div>"}]},{"id":"position-zindex","group":"Utilidades","title":"Position, inset y z-index","subtitle":"Aprende cuándo un elemento permanece en el flujo y cuándo puede colocarse respecto a otro contenedor.","easy":"position cambia cómo se calcula la ubicación de una caja. Tailwind ofrece static, relative, absolute, fixed y sticky; luego top/right/bottom/left o inset controlan sus desplazamientos.","daily":"Piensa en notas: static está en el cuaderno normal; absolute se pega a una página concreta; fixed se pega a la pantalla; sticky se queda pegada al llegar a cierto punto.","behind":"Un elemento absolute busca normalmente el ancestro posicionado más cercano. Por eso es común combinar un padre relative con un hijo absolute.","remember":"Primero elige el modo de posicionamiento; después usa inset/top/etc.; z-index solo decide qué capa queda encima cuando se superponen.","why":"Los badges, iconos y barras sticky del proyecto dependen de estas propiedades.","files":[["index.html","Añade un badge absoluto y una barra sticky de ejemplo","edit"]],"steps":["Crea una tarjeta con class relative.","Agrega un badge hijo con absolute top-3 right-3.","Prueba fixed en un pequeño botón de ayuda.","Prueba sticky top-0 en un encabezado dentro de un contenedor con scroll."],"code_file":"Fragmento para index.html","code":"<article class=\"relative rounded-2xl border p-6\">\n  <span class=\"absolute right-3 top-3 rounded-full bg-cyan-500 px-2 py-1 text-xs font-bold\">Nuevo</span>\n  <h3>Curso</h3>\n</article>","check":"El badge se ubica respecto a la tarjeta porque el padre es relative.","activity":"Crea un punto de notificación sobre un avatar usando relative + absolute + top/right.","extra":"Quita relative del padre y observa respecto a qué caja intenta posicionarse el absolute.","preview":"<div class=\"relative rounded-xl border p-6\"><span class=\"absolute right-2 top-2 rounded-full bg-cyan-500 px-2 py-1 text-xs font-bold\">Nuevo</span><b>Tarjeta relative</b></div>","properties":[{"name":"position: relative","family":"relative","css":"position: relative;","what":"Mantiene el elemento en el flujo normal y además crea un contexto útil para hijos absolute.","values":"relative.","when":"Padres de badges, iconos posicionados y pequeños ajustes con inset.","pitfall":"Agregar relative esperando que el elemento se mueva por sí solo; necesita top/left/etc. si quieres desplazarlo.","example":"<div class=\"relative\">...</div>","preview":"<div class=\"relative rounded bg-slate-100 p-3\">relative</div>"},{"name":"position: absolute","family":"absolute","css":"position: absolute;","what":"Saca la caja del flujo normal y la posiciona respecto al ancestro posicionado apropiado.","values":"absolute + inset/top/right/bottom/left.","when":"Badges, botones sobre imágenes, iconos dentro de inputs.","pitfall":"No crear un ancestro relative y ver al elemento posicionarse respecto a una caja inesperada.","example":"<span class=\"absolute right-2 top-2\">...</span>","preview":"<div class=\"relative h-20 rounded bg-slate-100\"><span class=\"absolute right-2 top-2 rounded bg-cyan-500 px-2 py-1 text-xs\">absolute</span></div>"},{"name":"position: fixed","family":"fixed","css":"position: fixed;","what":"Posiciona el elemento respecto al viewport; permanece en el mismo lugar al hacer scroll.","values":"fixed + inset/top/right/bottom/left.","when":"Botones flotantes, banners y algunos overlays.","pitfall":"Crear headers fixed sin reservar espacio y tapar el contenido de debajo.","example":"<button class=\"fixed bottom-4 right-4\">...</button>","preview":"<div class=\"text-sm text-slate-600\">fixed se usa para elementos anclados a la ventana.</div>"},{"name":"position: sticky","family":"sticky","css":"position: sticky;","what":"Se comporta en el flujo hasta alcanzar un umbral como top-0 y entonces permanece pegado dentro de su contexto de scroll.","values":"sticky top-0, sticky bottom-0.","when":"Encabezados de tabla, navegación lateral y toolbars.","pitfall":"Olvidar top-0 y pensar que sticky está roto; también puede fallar según overflow del ancestro.","example":"<header class=\"sticky top-0\">...</header>","preview":"<div class=\"rounded bg-cyan-100 p-2\">sticky necesita un umbral como top-0</div>"},{"name":"inset / top / right / bottom / left","family":"inset-* / top-* / right-* / bottom-* / left-*","css":"top: 0.5rem; right: 0.5rem;","what":"Define desplazamientos para elementos posicionados. inset-* puede establecer varios lados de una vez.","values":"inset-0, inset-x-0, inset-y-0, top-0, right-3, -top-1, start-0/end-0.","when":"Overlays, badges, iconos en inputs y paneles.","pitfall":"Aplicar top-* a un elemento static y no ver efecto.","example":"<span class=\"absolute inset-0\">...</span>","preview":"<div class=\"relative h-16 rounded bg-slate-100\"><span class=\"absolute bottom-2 left-2 text-xs\">bottom-2 left-2</span></div>"},{"name":"z-index","family":"z-*","css":"z-index: 20;","what":"Controla el orden de apilamiento cuando cajas se superponen, dentro de sus contextos de stacking.","values":"z-0, z-10, z-20, z-30, z-40, z-50, z-auto o valores arbitrarios.","when":"Menús, tooltips, overlays y barras sticky.","pitfall":"Subir z-50 una y otra vez sin entender stacking contexts creados por transform/opacity/position.","example":"<div class=\"relative z-20\">...</div>","preview":"<div class=\"text-sm text-slate-600\">z-index funciona cuando hay superposición y depende del contexto de apilamiento.</div>"}]},{"id":"overflow-media","group":"Utilidades","title":"Overflow, aspect-ratio y ajuste de imágenes","subtitle":"Controla qué ocurre cuando el contenido desborda y cómo se recortan imágenes dentro de una caja.","easy":"No todo contenido cabe exactamente en su caja. overflow decide si se muestra, recorta o crea scroll. Para medios, object-fit y aspect-ratio ayudan a mantener composiciones estables.","daily":"Es como una ventana: overflow-hidden tapa lo que sale del marco; overflow-auto agrega una forma de desplazarse cuando hace falta; object-cover recorta la foto para llenar el marco.","behind":"overflow actúa sobre contenido que excede la caja. object-fit solo afecta elementos reemplazados como img/video. aspect-ratio define una proporción entre ancho y alto.","remember":"overflow, object-fit y aspect-ratio resuelven problemas diferentes aunque suelen aparecer juntos en tarjetas con imágenes.","why":"Las tarjetas de cursos necesitan imágenes que mantengan proporción y no deformen el layout.","files":[["index.html","Mejora la zona visual de las tarjetas","edit"]],"steps":["Crea un contenedor con altura limitada y texto largo.","Prueba overflow-hidden y overflow-auto.","Crea una caja aspect-video.","Inserta una imagen con h-full w-full object-cover."],"code_file":"Fragmento para index.html","code":"<div class=\"aspect-video overflow-hidden rounded-2xl\">\n  <img class=\"h-full w-full object-cover\" src=\"curso.jpg\" alt=\"Curso\">\n</div>","check":"La imagen llena una caja 16:9 sin deformarse; puede recortarse en los bordes.","activity":"Prueba object-contain y object-cover con la misma imagen y explica la diferencia.","extra":"Agrega overflow-auto a un panel de altura fija y comprueba cuándo aparece el scroll.","preview":"<div class=\"aspect-video overflow-hidden rounded-xl bg-slate-200\"><div class=\"grid h-full place-items-center bg-gradient-to-br from-cyan-200 to-slate-200 font-bold\">aspect-video</div></div>","properties":[{"name":"overflow","family":"overflow-*","css":"overflow: auto;","what":"Decide qué hacer cuando el contenido excede el ancho o alto disponible.","values":"overflow-visible, hidden, clip, auto, scroll; overflow-x-* y overflow-y-*.","when":"Paneles con scroll, recortes de imágenes y prevención de desbordes.","pitfall":"Usar overflow-hidden para “arreglar” un layout roto y terminar ocultando contenido importante.","example":"<div class=\"max-h-40 overflow-auto\">...</div>","preview":"<div class=\"max-h-20 overflow-auto rounded border p-2 text-sm\">Contenido con scroll cuando hace falta. Línea 1. Línea 2. Línea 3. Línea 4.</div>"},{"name":"aspect-ratio","family":"aspect-*","css":"aspect-ratio: 16 / 9;","what":"Reserva una proporción entre ancho y alto.","values":"aspect-square, aspect-video, aspect-auto, aspect-[4/3].","when":"Miniaturas, videos, cards y placeholders de imágenes.","pitfall":"Fijar además width y height incompatibles y no entender qué regla termina dominando.","example":"<div class=\"aspect-video\">...</div>","preview":"<div class=\"aspect-video max-w-xs rounded bg-cyan-100\"></div>"},{"name":"object-fit","family":"object-*","css":"object-fit: cover;","what":"Controla cómo una imagen/video se adapta dentro de su caja cuando sus dimensiones no coinciden.","values":"object-cover, object-contain, object-fill, object-none, object-scale-down.","when":"Miniaturas y galerías con tamaños uniformes.","pitfall":"Usar object-cover sin definir dimensiones o un contenedor claro y no notar diferencia.","example":"<img class=\"h-40 w-full object-cover\">","preview":"<div class=\"h-24 overflow-hidden rounded bg-slate-100\"><div class=\"grid h-full place-item a tarjeta debe distinguirse del fondo incluso si quitas la sombra; el borde sigue ayudando.","activity":"Crea tres variantes de radius: rounded-lg, rounded-2xl y rounded-none.","extra":"Evita usar sombras muy fuertes en todos los componentes.","preview":"<article class=\"rounded-2xl border border-slate-200 bg-white p-5 shadow-sm\"><span class=\"rounded-full bg-cyan-50 px-3 py-1 text-xs font-bold text-cyan-700\">Básico</span><h3 class=\"mt-4 text-lg font-bold\">HTML + Tailwind</h3><p class=\"mt-2 text-sm text-slate-500\">Primera tarjeta del proyecto.</p></article>","properties":[{"name":"border-width","family":"border, border-2, border-x-*…","css":"border-width: 1px;","what":"Define el grosor del borde. Puede aplicarse a todos los lados o por eje/lado.","values":"border, border-0, border-2, border-4, border-t, border-x-2, border-s-4 y propiedades lógicas.","when":"Tarjetas, inputs, divisores y estados de selección.","pitfall":"Esperar ver el borde sin definir un color legible sobre el fondo.","example":"<div class=\"border-2\">Caja</div>","preview":"<div class=\"rounded-lg border-2 border-cyan-500 p-3\">border-2</div>"},{"name":"border-color","family":"border-{color}","css":"border-color: var(--color-slate-200);","what":"Cambia el color del borde, no su grosor.","values":"border-slate-200, border-cyan-500, border-transparent, border-current. También variantes por lado.","when":"Estados de inputs, tarjetas, separadores y avisos.","pitfall":"Escribir solo border-cyan-500 sin una anchura visible cuando el componente no tenía borde.","example":"<input class=\"border border-cyan-500\">","preview":"<div class=\"rounded-lg border border-cyan-500 p-3\">border-cyan-500</div>"},{"name":"border-style","family":"border-solid / dashed / dotted","css":"border-style: dashed;","what":"Define el patrón visual del borde.","values":"border-solid, border-dashed, border-dotted, border-double, border-hidden, border-none.","when":"Zonas de carga, placeholders, separadores o estados especiales.","pitfall":"Confundir border-none con border-transparent: el primero elimina el borde; el segundo conserva el espacio.","example":"<div class=\"border-2 border-dashed\">...</div>","preview":"<div class=\"rounded-lg border-2 border-dashed border-slate-400 p-3\">border-dashed</div>"},{"name":"border-radius","family":"rounded-*","css":"border-radius: var(--radius-xl);","what":"Redondea las esquinas. Puedes aplicarlo a toda la caja o a lados concretos.","values":"rounded-none, rounded-sm, rounded, rounded-lg, rounded-xl, rounded-2xl, rounded-full; rounded-t-* etc.","when":"Botones, avatares, tarjetas y superficies.","pitfall":"Usar rounded-full en un rectángulo esperando un círculo. Para círculo, ancho y alto deben ser iguales.","example":"<div class=\"rounded-2xl\">...</div>","preview":"<div class=\"h-16 w-16 rounded-full bg-cyan-500\"></div>"},{"name":"box-shadow","family":"shadow-*","css":"box-shadow: var(--shadow-lg);","what":"Añade profundidad mediante sombras alrededor de la caja.","values":"shadow-2xs, shadow-xs, shadow-sm, shadow-md, shadow-lg, shadow-xl, shadow-2xl, shadow-none; valores arbitrarios.","when":"Tarjetas elevadas, menús, modales y elementos flotantes.","pitfall":"Usar sombras demasiado fuertes en todos los elementos; destruye la jerarquía.","example":"<article class=\"shadow-lg\">...</article>","preview":"<div class=\"rounded-xl bg-white p-4 shadow-lg\">shadow-lg</div>"},{"name":"ring","family":"ring-*","css":"box-shadow: ... ring ...;","what":"Crea un anillo visual alrededor del elemento, muy útil para foco y selección.","values":"ring, ring-2, ring-4, ring-cyan-500, ring-offset-2, inset-ring-* en v4.","when":"Focus-visible, elementos seleccionados y controles interactivos.","pitfall":"Usar ring como decoración permanente en muchos elementos, cuando debería indicar estado.","example":"<button class=\"focus-visible:ring-4 focus-visible:ring-cyan-300\">...</button>","preview":"<button class=\"rounded-lg bg-slate-900 px-4 py-2 text-white ring-4 ring-cyan-200\">ring-4</button>"},{"name":"opacity","family":"opacity-*","css":"opacity: 0.5;","what":"Cambia la transparencia del elemento completo, incluidos sus hijos.","values":"opacity-0, opacity-25, opacity-50, opacity-75, opacity-100 o valores arbitrarios.","when":"Estados deshabilitados, animaciones, capas decorativas.","pitfall":"Usar opacity-50 para un fondo y descubrir que también vuelve transparente el texto. Mejor usar color con alfa cuando solo quieres transparentar el fondo.","example":"<div class=\"opacity-50\">...</div>","preview":"<div class=\"rounded bg-cyan-500 p-3 font-bold opacity-50\">opacity-50</div>"}]},{"id":"flexbox","group":"Utilidades","title":"Flexbox: cada propiedad por separado","subtitle":"Construye la barra de navegación y alinea elementos.","easy":"Flexbox es ideal para distribuir elementos en una dimensión: una fila o una columna. Tailwind expone flex, items-*, justify-* y gap-*.","daily":"Piensa en personas formando una fila: puedes decidir si se pegan al inicio, se separan o se centran verticalmente.","behind":"display:flex activa el modelo flexible. justify controla el eje principal e items el eje cruzado.","remember":"flex no significa “centrar”. El resultado depende de direction, justify y items.","why":"La navegación necesita logo a la izquierda y acciones a la derecha.","files":[["index.html","Agrega header y navegación","edit"]],"steps":["Antes del hero crea header.","Usa flex items-center justify-between.","Agrupa los enlaces en otro contenedor flex.","Usa gap para separar los enlaces."],"code_file":"tailwind_academy/index.html","code":"<header class=\"border-b border-slate-200 bg-white\">\n  <nav class=\"mx-auto flex max-w-6xl items-center justify-between px-6 py-4\">\n    <a class=\"font-black text-slate-950\" href=\"#\">Tailwind Academy</a>\n    <div class=\"flex items-center gap-5 text-sm font-semibold text-slate-600\">\n      <a href=\"#cursos\">Cursos</a>\n      <a href=\"#proyecto\">Proyecto</a>\n    </div>\n  </na ":"Navbars, barras de acciones y centrado en el eje principal.","pitfall":"Confundir justify-center con items-center. El eje depende de flex-direction.","example":"<div class=\"flex justify-between\">...</div>","preview":"<div class=\"flex justify-between rounded bg-slate-100 p-3\"><span>Izq.</span><span>Der.</span></div>"},{"name":"align-items","family":"items-*","css":"align-items: center;","what":"Alinea hijos sobre el eje TRANSVERSAL. En flex-row suele ser vertical.","values":"items-start, items-center, items-end, items-stretch, items-baseline.","when":"Centrar iconos con texto, alinear controles y tarjetas.","pitfall":"Usar items-center esperando centrar horizontalmente en flex-row; ahí necesitas justify-center.","example":"<div class=\"flex items-center\">...</div>","preview":"<div class=\"flex h-20 items-center gap-2 rounded bg-slate-100 p-3\"><span>●</span><span>Centrado vertical</span></div>"},{"name":"flex-wrap","family":"flex-wrap / nowrap","css":"flex-wrap: wrap;","what":"Permite que los hijos bajen a nuevas líneas cuando ya no caben.","values":"flex-nowrap, flex-wrap, flex-wrap-reverse.","when":"Chips, botones, etiquetas y barras que deben adaptarse a ancho reducido.","pitfall":"Olvidar gap cuando se usa wrap y terminar con elementos pegados.","example":"<div class=\"flex flex-wrap gap-2\">...</div>","preview":"<div class=\"flex max-w-xs flex-wrap gap-2\"><span class=\"rounded bg-cyan-100 p-2\">HTML</span><span class=\"rounded bg-cyan-100 p-2\">CSS</span><span class=\"rounded bg-cyan-100 p-2\">Tailwind</span></div>"},{"name":"flex-grow / shrink","family":"grow / shrink","css":"flex-grow: 1; flex-shrink: 1;","what":"Controla si un ítem puede crecer para ocupar espacio libre o encogerse cuando falta espacio.","values":"grow, grow-0, shrink, shrink-0.","when":"Inputs junto a botones, barras y layouts donde un elemento debe absorber espacio.","pitfall":"Poner grow en todos los hijos sin entender que repartirán el espacio disponible.","example":"<input class=\"grow\">","preview":"<div class=\"flex gap-2\"><div class=\"grow rounded bg-slate-100 p-2\">grow</div><div class=\"rounded bg-cyan-100 p-2\">fijo</div></div>"},{"name":"flex-basis","family":"basis-*","css":"flex-basis: 50%;","what":"Define el tamaño base inicial de un ítem flex antes de repartir el espacio.","values":"basis-1/2, basis-1/3, basis-64, basis-auto, basis-full.","when":"Columnas flexibles y proporciones en layouts flex.","pitfall":"Confundir basis con width: en flex, basis participa directamente en el algoritmo flex.","example":"<div class=\"basis-1/3\">...</div>","preview":"<div class=\"flex gap-2\"><div class=\"basis-1/3 bg-slate-100 p-2\">1/3</div><div class=\"basis-2/3 bg-cyan-100 p-2\">2/3</div></div>"},{"name":"order","family":"order-*","css":"order: 2;","what":"Cambia el orden visual de un ítem flex/grid sin moverlo en el HTML.","values":"order-first, order-last, order-none, order-1 … order-12.","when":"Reordenamientos visuales responsive muy concretos.","pitfall":"Cambiar el orden visual y crear una experiencia diferente para teclado/lectores. Úsalo con cuidado.","example":"<div class=\"order-first md:order-last\">...</div>","preview":"<div class=\"flex gap-2\"><div class=\"order-2 bg-slate-100 p-2\">A(order 2)</div><div class=\"order-1 bg-cyan-100 p-2\">B(order 1)</div></div>"}]},{"id":"grid","group":"Utilidades","title":"CSS Grid: cada propiedad por separado","subtitle":"Organiza varias tarjetas de cursos.","easy":"Grid es útil cuando necesitas filas y columnas. Con grid-cols-* defines columnas y gap-* define la separación.","daily":"Es como una estantería: primero decides cuántos espacios tiene cada fila y luego colocas tarjetas.","behind":"grid activa CSS Grid; grid-cols-3 crea tres columnas iguales; gap agrega separación entre celdas.","remember":"Flexbox suele resolver una fila; Grid suele resolver una cuadrícula completa.","why":"Ahora que existe una tarjeta, necesitamos mostrar varias sin repetir reglas CSS.","files":[["index.html","Con
